[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crawlforge"
version = "0.2.0"
description = "Scope-aware web crawler with CLI, interactive menu, and local dashboard"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "CrawlForge contributors" }]
readme = "README.md"
keywords = ["web-crawler", "reconnaissance", "security-testing", "python"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.scripts]
crawlforge = "crawlforge.cli:main"

[tool.setuptools]
packages = ["crawlforge"]

[tool.setuptools.package-data]
crawlforge = ["static/*.html"]
